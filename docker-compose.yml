version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shakti-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DEMO_MODE=${DEMO_MODE:-true}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-file:/data/shakti.db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-saathi-dev-secret-key-change-in-production}
      - HMAC_SECRET_KEY=${HMAC_SECRET_KEY:-saathi-dev-secret-key-change-in-production}
      - DEMO_ADMIN_HINT=${DEMO_ADMIN_HINT:-}
      - ALLOW_MOCK_PROVIDERS=${ALLOW_MOCK_PROVIDERS:-true}
    volumes:
      - shakti_data:/data

volumes:
  shakti_data:
    name: shakti_data
