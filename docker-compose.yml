version: "3.9"

services:
  saathi:
    image: node:22-alpine
    container_name: saathi-app
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      PORT: 3000
      DATABASE_URL: file:./saathi.db
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
