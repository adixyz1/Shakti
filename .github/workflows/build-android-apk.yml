name: Build Android APK (Standalone Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    name: Build Standalone Android APK (shakti.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21 (Required by Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Build production web bundle (dist/) and sync Capacitor Android
        run: |
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compile standalone installable Android APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy compiled APK to shakti.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/shakti.apk
          ls -lh public/shakti.apk

      - name: Upload shakti.apk as downloadable GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shakti-android-apk
          path: public/shakti.apk
          if-no-files-found: error
          retention-days: 30
