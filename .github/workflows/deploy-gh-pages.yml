name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static frontend for GitHub Pages
        env:
          # Automatically sets /<repo-name>/ for project pages, or / for <username>.github.io user pages
          VITE_BASE_PATH: ${{ endsWith(github.repository, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          # Optional: Set VITE_REMOTE_SERVER_URL in GitHub Repo Settings -> Variables -> Actions (e.g. https://shakti-api.onrender.com)
          VITE_REMOTE_SERVER_URL: ${{ vars.VITE_REMOTE_SERVER_URL }}
        run: |
          npm run build
          # Copy index.html to 404.html so refreshing client-side routes (/home, /settings, etc.) works on GitHub Pages
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
